[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-dspy-poc"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "dspy==3.3.1",
  "langgraph==1.2.11",
  "fastapi==0.115.14",
  "uvicorn[standard]==0.34.3",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "pydantic==2.12.5",
  "openai==2.26.0",
  "solders==0.26.0",
  "base58==2.1.1",
  "asyncpg==0.31.0",
  "redis==8.1.0",
  "clickhouse-connect>=0.8.18,<1",
  "langfuse==4.15.1",
  "mcp==1.30.0",
  "eth-account>=0.13.7,<1",
  "eth-abi>=5,<6",
  "x402[fastapi,evm]==2.22.0",
  "stripe>=13,<14",
  # FastAPI 0.115 pins Starlette below 0.47; prevent an incompatible SSE major.
  "sse-starlette>=1.6.1,<3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
