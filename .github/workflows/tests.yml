name: Routing and execution regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python scripts/check_secrets.py
      - run: pytest -q
        env:
          DATABASE_URL: ''
          REDIS_URL: ''
          LIVE_TRADING: 'false'
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/orbit_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:relay
      - run: npm run build:executors
      - run: node --test tests/browser-executors.test.cjs
